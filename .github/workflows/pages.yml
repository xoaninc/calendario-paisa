name: Publicar la web

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # cada hora: recoge los cambios del calendario de Outlook
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Construir y publicar van en dos trabajos separados, como en la plantilla oficial de GitHub Pages.
  # Así el paquete "github-pages" ya está cerrado cuando empieza la publicación.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir desde el calendario de Outlook
        run: python3 scripts/build.py
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.reintento.outputs.page_url }}
    steps:
      # A veces la API de GitHub no encuentra el paquete recién subido
      # ("Fetching artifact metadata failed"); se espera un minuto y se reintenta una vez.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: reintento
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
